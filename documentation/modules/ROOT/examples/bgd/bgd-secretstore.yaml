apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend-0.8.1
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  provider:
    vault:
      server: "http://vault.vault:8200"
      path: "kv"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          key: "token"
